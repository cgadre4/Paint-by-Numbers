[project]
name = "paint-by-numbers"
version = "1.2.0"
description = "Local paint-by-numbers image processor"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "opencv-python>=4.10,<5",
    "numpy>=2,<3",
    "pillow>=13,<14",
    "python-multipart>=0.0.18,<1",
    "reportlab>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "playwright>=1.50,<2",
    "ruff>=0.17.2",
    "pip-audit>=2.10.1",
    "httpx2>=2.16.0",
    "psutil>=7.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
exclude = ["benchmarks/legacy.py", "benchmarks/adjacent_v1.py", "benchmarks/facial_baseline.py", ".local"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
