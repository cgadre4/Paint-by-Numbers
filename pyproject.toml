[project]
name = "paint-by-numbers"
version = "1.1.0"
description = "Local paint-by-numbers image processor"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "opencv-python>=4.10,<5",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "python-multipart>=0.0.18,<1",
    "reportlab>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdf>=5,<7", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
